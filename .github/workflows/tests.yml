name: CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Pytest & Schema Validation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: greentree_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    env:
      SECRET_KEY: "ci-insecure-test-key-for-github-actions-evaluation"
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      API_KEY_SECRET: "ci-test-service-api-key-for-github-actions-evaluation"
      # Public CI test value: must never be used outside CI
      FIELD_ENCRYPTION_KEY: "gfe5N-_1X2ET4v2grNQcDh_skd4a_n6sgik0Q_FdkrM="
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/greentree_test"
      EXTERNAL_API_BASE_URL: "https://api.thirdparty-crm.com/v1"
      EXTERNAL_API_TIMEOUT: "5"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check .

      - name: Validate System Configuration
        run: |
          python manage.py check

      - name: Check for Unapplied Model Migrations
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Validate OpenAPI Schema Generation
        run: |
          python manage.py spectacular --validate

      - name: Run Database Migrations
        run: |
          python manage.py migrate

      - name: Execute Automated Test Suite (Pytest)
        run: |
          pytest -v --durations=10
